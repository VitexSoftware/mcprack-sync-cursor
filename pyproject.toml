[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mcprack-sync-cursor"
version = "1.0.0"
description = "Keep Cursor IDE MCP server config in sync with mcprack"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Vítězslav Dvořák", email = "info@vitexsoftware.cz"}]
dependencies = ["mcprack-client>=1.0.0"]

[project.scripts]
mcprack-sync-cursor = "mcprack_sync_cursor.__main__:main"

[project.urls]
Homepage = "https://github.com/VitexSoftware/mcprack-sync-cursor"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcprack_sync_cursor*"]
